benchmark:
  name: income-realism-simple-gan-candidate-a-smoke
  type: income_realism
  models:
    - simple_gan
  seeds:
    - 41
  train_sizes:
    - 1000
  synthetic_rows: 1000
  holdout_fraction: 0.20
  assessment_mode: smoke
  continue_on_error: true

calibration:
  income_model_version: 2

models:
  simple_gan:
    epochs: 20
    batch_size: 128
    latent_dim: 64
    generator_hidden_dims:
      - 256
      - 512
      - 512
    discriminator_hidden_dims:
      - 512
      - 256
    learning_rate: 0.0001
    beta_1: 0.5
    verbose_every: 0
    metrics_every: 0

generation:
  batch_size: 512
  max_batches: 10
  date_format: "%Y-%m-%d"

evaluation:
  privacy:
    max_nearest_neighbor_rows: 500
  income_realism:
    minimum_group_rows: 20

quality_gates:
  duplicate_base_row_rate_max:
    value: 0.01
    mandatory: false

outputs:
  base_directory: artifacts/benchmarks
  export_csv: true
  export_parquet: true
  export_json: true
  export_individual_xlsx: false

execution:
  parallelism: 1
  warmup_backends: true
  rotate_model_order_by_seed: false

resource_limits:
  max_training_seconds_per_run: null
  max_total_seconds_per_run: null
  max_peak_memory_mb: null
  stop_larger_sizes_after_resource_failure: true

ranking:
  enabled: false
