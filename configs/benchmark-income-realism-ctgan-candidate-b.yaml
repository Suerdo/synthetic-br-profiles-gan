benchmark:
  name: income-realism-ctgan-candidate-b
  type: income_realism
  models:
    - ctgan
  seeds:
    - 41
    - 42
    - 43
  train_sizes:
    - 20000
  synthetic_rows: 20000
  holdout_fraction: 0.20
  assessment_mode: experimental
  continue_on_error: true

calibration:
  income_model_version: 2

models:
  ctgan:
    epochs: 20
    batch_size: 500
    embedding_dim: 256
    generator_dim:
      - 512
      - 512
    discriminator_dim:
      - 512
      - 512
    verbose: false
    enable_gpu: false
    cuda: null

generation:
  batch_size: 2048
  max_batches: 20
  date_format: "%Y-%m-%d"

evaluation:
  privacy:
    max_nearest_neighbor_rows: 1000
  income_realism:
    minimum_group_rows: 30

quality_gates:
  duplicate_base_row_rate_max:
    value: 0.01
    mandatory: false

outputs:
  base_directory: artifacts/benchmarks
  export_csv: true
  export_parquet: true
  export_json: true
  export_individual_xlsx: false

execution:
  parallelism: 1
  warmup_backends: true
  rotate_model_order_by_seed: false

resource_limits:
  max_training_seconds_per_run: null
  max_total_seconds_per_run: null
  max_peak_memory_mb: null
  stop_larger_sizes_after_resource_failure: true

ranking:
  enabled: false
