benchmark:
  name: programmatic-smoke
  models:
    - programmatic
  seeds:
    - 11
  calibration_rows: 200
  synthetic_rows: 100
  holdout_fraction: 0.20
  assessment_mode: smoke
  continue_on_error: true
  reference_date: "2026-07-26"

calibration:
  income:
    min: 800.0
    max: 50000.0
  age:
    min: 18
    max: 85
  region_weights:
    Norte: 0.09
    Nordeste: 0.27
    Centro-Oeste: 0.08
    Sudeste: 0.42
    Sul: 0.14

models:
  programmatic: {}

generation:
  batch_size: 128
  max_batches: 5
  date_format: "%Y-%m-%d"

evaluation:
  privacy:
    max_nearest_neighbor_rows: 100
    exclude_columns:
      - Nome
      - Data_Nascimento
      - CPF
      - CNH
      - RG
      - Titulo_Eleitor
      - Telefone

quality_gates:
  min_evaluation_rows: 100
  invalid_rows_max:
    value: 0
    mandatory: true
  duplicated_identifier_max:
    value: 0
    mandatory: true
  null_required_fields_max:
    value: 0
    mandatory: true
  exact_train_match_rate_max:
    value: 0.01
    mandatory: true
  total_variation_distance_max:
    value: 0.25
    mandatory: false
  correlation_difference_max:
    value: 0.3
    mandatory: false

outputs:
  base_directory: artifacts/benchmarks
  export_csv: true
  export_parquet: true
  export_json: true
  export_individual_xlsx: false

execution:
  parallelism: 1

ranking:
  enabled: false
