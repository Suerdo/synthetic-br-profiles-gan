application:
  title: "Plataforma de Dados Sintéticos Brasileiros"
  subtitle: "Geração, avaliação e governança de perfis sintéticos brasileiros para desenvolvimento, testes, pesquisa e Inteligência Artificial responsável."
  preview_rows: 20
  models_root: "artifacts/models"
  web_sessions_root: "artifacts/web_sessions"
  artifacts_root: "artifacts"

generation:
  default_rows: 1000
  min_rows: 1
  limits:
    programmatic: 100000
    ctgan: 50000
    simple_gan: 20000

defaults:
  model: programmatic
  preset: completo
  format: csv
  seed: 41

model_artifacts:
  approved:
    ctgan: []
    simple_gan: []

audit:
  events_path: "artifacts/web_audit/events.jsonl"
