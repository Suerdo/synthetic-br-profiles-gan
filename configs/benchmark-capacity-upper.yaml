benchmark:
  name: capacity-upper-bound
  type: capacity
  models:
    - programmatic
    - ctgan
  seeds:
    - 41
  train_sizes:
    - 400000
    - 800000
    - 1600000
  synthetic_rows: 1000
  holdout_fraction: 0.20
  assessment_mode: smoke
  continue_on_error: true
  reference_date: "2026-07-26"

calibration:
  income:
    min: 800.0
    max: 50000.0
  age:
    min: 18
    max: 85
  region_weights:
    Norte: 0.09
    Nordeste: 0.27
    Centro-Oeste: 0.08
    Sudeste: 0.42
    Sul: 0.14

models:
  programmatic: {}

  ctgan:
    epochs: 1
    batch_size: 500
    verbose: false
    enable_gpu: false
    cuda: null

generation:
  batch_size: 2048
  max_batches: 20
  date_format: "%Y-%m-%d"

evaluation:
  privacy:
    max_nearest_neighbor_rows: 1000
    exclude_columns:
      - Nome
      - Data_Nascimento
      - CPF
      - CNH
      - RG
      - Titulo_Eleitor
      - Telefone

quality_gates:
  min_evaluation_rows: 100
  invalid_rows_max:
    value: 0
    mandatory: true
  duplicated_identifier_max:
    value: 0
    mandatory: true
  null_required_fields_max:
    value: 0
    mandatory: true
  exact_train_match_rate_max:
    value: 0.01
    mandatory: true
  total_variation_distance_max:
    value: 0.25
    mandatory: false
  correlation_difference_max:
    value: 0.3
    mandatory: false

outputs:
  base_directory: artifacts/benchmarks
  export_csv: true
  export_parquet: true
  export_json: true
  export_individual_xlsx: false

execution:
  parallelism: 1
  warmup_backends: true
  rotate_model_order_by_seed: false
  subprocess_isolation: true
  subprocess_timeout_seconds: null

resource_limits:
  max_training_seconds_per_run: null
  max_total_seconds_per_run: null
  max_peak_memory_mb: null
  stop_larger_sizes_after_resource_failure: true

ranking:
  enabled: false
