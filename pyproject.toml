[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-br-profiles-gan"
version = "0.2.0"
description = "Experimental pipeline for synthetic Brazilian profile generation."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "faker>=24.0",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "psutil>=5.9",
  "PyYAML>=6.0",
  "scipy>=1.12",
]

[project.optional-dependencies]
simple-gan = ["tensorflow>=2.16"]
ctgan = ["ctgan>=0.12.1,<0.13"]
all-models = ["tensorflow>=2.16", "ctgan>=0.12.1,<0.13"]
ui = ["streamlit>=1.37"]
test = ["pytest>=8.0"]

[project.scripts]
synthetic-br-profiles-gan = "synthetic_br_profiles_gan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
